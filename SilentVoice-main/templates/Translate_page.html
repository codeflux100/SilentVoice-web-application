{% extends 'layout.html' %}

{% block other_css %}
     <link rel="stylesheet" href="{{ url_for('static', filename='translate_page_style.css') }}">
{% endblock %}

{% block content %}
<div class="translate-detail-wrapper">
    <div class="translate-modal-card">
        
        <!-- Studio Header -->
        <div class="studio-header">
            <div class="studio-title-group">
                <span class="studio-badge">AI COMPUTER VISION</span>
                <h1 class="studio-heading">Live Vision Translator</h1>
            </div>
            
            <div class="recording-status">
                <span class="pulse-dot"></span>
                <span>REC LIVE</span>
            </div>
        </div>

        <!-- Camera Viewfinder Stage -->
        <div class="camera_image">
            <img src="{{ url_for('video_feed') }}" class="video_feed_stream" alt="Live Translation Stream">

            <!-- AI Recognition Bounding Box & Text Overlay -->
            <div class="ai-viewfinder-overlay">
                <div class="ai-bounding-box">
                    <span class="box-tag">ISL Tracking (99.4%)</span>
                </div>

                <!-- Text After Translation Overlay -->
                <div class="text_messages">
                    <span class="check-icon">✓</span>
                    <span class="translated-result-text">Text After translation</span>
                </div>
            </div>
        </div>

        <!-- Control Panel Toolbar -->
        <div class="control_panel">
            <div class="control-toolbar">
                <div class="camera control" title="Camera Settings">
                    <img src="{{ url_for('static', filename='images/camera.png') }}" class="cam image" alt="Camera">
                </div>
                
                <div class="microphone control" title="Audio / Mic">
                    <img src="{{ url_for('static', filename='images/microphone.png') }}" class="mic image" alt="Microphone">
                </div>
                
                <div class="text control" title="Subtitles">
                    <img src="{{ url_for('static', filename='images/message.png') }}" class="txt image" alt="Subtitles">
                </div>
                
                <div class="close control" id="close-button" title="Stop & Exit Camera">
                    <img src="{{ url_for('static', filename='images/close.png') }}" class="cross image" alt="Exit">
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block other_js %}
    <script>
        document.getElementById('close-button').addEventListener('click', function() {
            document.querySelector('.video_feed_stream').src = "";
            fetch('{{ url_for("release_camera") }}', { method: 'GET' })
                .then(response => {
                    window.location.href = '{{ url_for("home_page") }}';
                })
                .catch(error => {
                    console.error('Error releasing camera:', error);
                    window.location.href = '{{ url_for("home_page") }}';
                });
        });
    </script>
{% endblock %}
