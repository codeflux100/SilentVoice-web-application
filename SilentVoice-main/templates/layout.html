<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Silent Voice</title>
        <link rel="icon" href="{{ url_for('static', filename='images/SilentVoiceLogo.png') }}" type="image/png" sizes="64x64">
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='layout_page_style.css') }}">
        {% block other_css %}{% endblock %}
    </head>
    <body class="quiet-place-layout {% block body_class %}{% endblock %}">
        <header class="app-header">
            <div class="site_logo">
                <a href="{{ url_for('home_page') }}" class="logo-link">
                    <img src="{{ url_for('static', filename='images/SilentVoiceLogo.png') }}" class="logo" alt="Silent Voice Logo">
                    <span class="branding">Silent Voice</span>
                </a>
            </div>
            
            <nav class="navigation_bar">
                <div class="main_page nav-item">
                    <a href="{{ url_for('main_page') }}" title="Main Page">
                        <img src="{{ url_for('static', filename='images/main_page_logo.png') }}" class="main_page_logo imgg" alt="Main">
                    </a>
                </div>
                <div class="home_page nav-item active">
                    <a href="{{ url_for('home_page') }}" title="Home Page">
                        <img src="{{ url_for('static', filename='images/home_page_logo.png') }}" class="home_page_logo imgg" alt="Home">
                    </a>
                </div>
                <div class="learn_page nav-item">
                    <a href="{{ url_for('learn_page') }}" title="Practice Signs">
                        <img src="{{ url_for('static', filename='images/learn_page_logo.png') }}" class="learn_page_logo imgg" alt="Practice">
                    </a>
                </div>
                <div class="translate_page nav-item">
                    <a href="{{ url_for('translate_page') }}" title="Live Translate">
                        <img src="{{ url_for('static', filename='images/translate_page_logo.png') }}" class="translate_page_logo imgg" alt="Translate">
                    </a>
                </div>
            </nav>

            <div class="profile" title="User Profile">
                <img src="{{ url_for('static', filename='images/profile_logo.png') }}" class="profile_pic" alt="Profile">
            </div>
        </header>

        <main class="main-content">
            {% block content %}

            {% endblock %}
        </main>
        {% block other_js %}{% endblock %}
    </body>
</html>
